{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}AEMS{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <h2>AEMS</h2>
          <small>AI Enterprise Management Suite</small>
        </div>

        <nav>
          <a href="{% url 'core:dashboard' %}">Dashboard</a>
          <a href="{% url 'hr:home' %}">Human Resources</a>
          <a href="{% url 'recruitment:home' %}">Recruitment</a>
          <a href="{% url 'finance:home' %}">Finance</a>
          <a href="/admin/">Administration</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <span>Enterprise Management</span>
          <span>AEMS | Management Portal</span>
        </header>

        <section class="page-content">
          {% block content %} {% endblock %}
        </section>
      </main>
    </div>
  </body>
</html>
