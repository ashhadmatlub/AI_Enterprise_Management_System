{% extends "base.html" %}

{% block title %}Delete Position | AEMS{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0">
        <div class="card-header bg-danger text-white py-3">
          <h5 class="card-title mb-0">Confirm Position Deletion</h5>
        </div>
        <div class="card-body p-4 text-center">
          <h5 class="fw-bold mb-2">Delete Job Position?</h5>
          <p class="text-muted mb-4">
            Are you sure you want to delete <strong>{{ position.title }}</strong> in <strong>{{ position.department }}</strong>?
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
              <a href="{% url 'hr:positions' %}" class="btn btn-secondary px-4">Cancel</a>
              <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
